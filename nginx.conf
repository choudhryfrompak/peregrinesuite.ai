server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Cloud Run nginx sees http on :8080, so its absolute redirects
    # pointed visitors at http://peregrinesuite.ai:8080/... (unreachable).
    # Relative redirects keep the visitor's own scheme, host and port.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for all routes
    location / {
        # /page and /page/ both serve /page/index.html directly — no redirect.
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
